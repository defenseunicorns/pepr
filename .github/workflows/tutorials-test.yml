name: Tutorials Test

permissions: read-all
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
  pull_request:
    branches: ["main"]
    paths:
      - "docs/**"

jobs:
  tutorials-test:
    name: tutorials test
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: clone pepr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: defenseunicorns/pepr
          path: pepr

      - name: install k3d
        uses: ./pepr/.github/actions/setup-k3d

      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: "npm"
          cache-dependency-path: pepr

      - name: "set env: PEPR"
        run: echo "PEPR=${GITHUB_WORKSPACE}/pepr" >> "$GITHUB_ENV"

      - name: install pepr deps
        run: |
          cd "$PEPR"
          npm ci
          npx vitest --config config/vitest.tutorials.config.ts run docs/tutorials/tests/*.test.ts

