name: Version Release # WARNING: docs.yml workflow_run trigger depends on this exact name

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "LICENSE"
      - "CODEOWNERS"

permissions:
  contents: read

jobs:
  tag-new-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created || 'false' }}
      release_version: ${{ steps.release.outputs.version || 'UNRELEASED' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Create Release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-publish-images:
    needs: [publish, tag-new-version]
    if: ${{ needs.tag-new-version.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      packages: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Use Node.js 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Login to Chainguard
        uses: chainguard-dev/setup-chainctl@2cddd35a2f120d9973e58094dc6878c93cf58c28 # v0.5.1
        with:
          identity: ${{ secrets.CHAINGUARD_IDENTITY }}

      - name: UDS Registry Login
        run: echo "${{ secrets.UDS_REGISTRY_PASSWORD }}" | docker login -u "${{ secrets.UDS_REGISTRY_USERNAME }}" --password-stdin registry.defenseunicorns.com
        shell: bash

      - name: "Pepr Controller: Login to GHCR"
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: dummy
          password: ${{ github.token }}

      - name: Set Version
        env:
          RELEASE_VERSION: ${{ needs.tag-new-version.outputs.release_version }}
        run: |
          node ./scripts/set-version.js "$RELEASE_VERSION"
          npm ci

      - name: Publish to GHCR
        env:
          RELEASE_VERSION: ${{ needs.tag-new-version.outputs.release_version }}
        run: ./.github/workflows/scripts/release.sh "$RELEASE_VERSION"

  slsa:
    if: ${{ needs.tag-new-version.outputs.release_created == 'true' }}
    needs: [tag-new-version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package-download-sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: "npm"

      - name: Build release package
        env:
          RELEASE_VERSION: ${{ needs.tag-new-version.outputs.release_version }}
        run: |
          node ./scripts/set-version.js "$RELEASE_VERSION"
          npm ci
          npm run build

      - name: Record release package digest
        id: package
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(pepr-*.tgz)
          if (( ${#packages[@]} != 1 )); then
            echo "Expected exactly one release package, found ${#packages[@]}." >&2
            exit 1
          fi
          package_path="${packages[0]}"
          echo "package-path=$package_path" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$package_path" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # A retry replaces only this run's intermediate handoff artifact.
          name: release-package
          path: ${{ steps.package.outputs.package-path }}
          if-no-files-found: error
          overwrite: true

  attest-release-package:
    needs: [slsa]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Download release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: ${{ runner.temp }}/release-package

      - name: Verify release package
        id: package
        shell: bash
        env:
          PACKAGE_DIRECTORY: ${{ runner.temp }}/release-package
          EXPECTED_SHA256: ${{ needs.slsa.outputs.package-download-sha256 }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=("$PACKAGE_DIRECTORY"/*.tgz)
          if (( ${#packages[@]} != 1 )); then
            echo "Expected exactly one release package, found ${#packages[@]}." >&2
            exit 1
          fi
          package_path="${packages[0]}"
          actual_sha256=$(sha256sum "$package_path" | awk '{print $1}')
          if [[ "$actual_sha256" != "$EXPECTED_SHA256" ]]; then
            echo "Release package SHA256 does not match the build output." >&2
            exit 1
          fi
          echo "name=$(basename "$package_path")" >> "$GITHUB_OUTPUT"
          echo "sha256=$actual_sha256" >> "$GITHUB_OUTPUT"

      - name: Attest verified release package
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-digest: sha256:${{ steps.package.outputs.sha256 }}
          subject-name: ${{ steps.package.outputs.name }}
          # Storage records are only available for registry-pushed OCI subjects
          # and require artifact-metadata: write. This subject is an npm tarball.
          push-to-registry: false
          create-storage-record: false

  publish:
    if: ${{ needs.tag-new-version.outputs.release_created == 'true' }}
    needs: [slsa, attest-release-package, tag-new-version]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Set up Node registry authentication
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing requires npm 11.5.1 or newer. Pin the version used
      # for releases so it does not depend on the runner's bundled npm version.
      - name: Install npm with trusted publishing support
        run: |
          npm install --global npm@12.0.2
          npm --version

      - name: Download release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: ${{ runner.temp }}/release-package

      - name: Verify release package
        id: package
        shell: bash
        env:
          PACKAGE_DIRECTORY: ${{ runner.temp }}/release-package
          EXPECTED_SHA256: ${{ needs.slsa.outputs.package-download-sha256 }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=("$PACKAGE_DIRECTORY"/*.tgz)
          if (( ${#packages[@]} != 1 )); then
            echo "Expected exactly one release package, found ${#packages[@]}." >&2
            exit 1
          fi
          package_path="${packages[0]}"
          actual_sha256=$(sha256sum "$package_path" | awk '{print $1}')
          if [[ "$actual_sha256" != "$EXPECTED_SHA256" ]]; then
            echo "Release package SHA256 does not match the build output." >&2
            exit 1
          fi
          echo "path=$package_path" >> "$GITHUB_OUTPUT"

      - name: Publish verified package with npm OIDC
        run: npm publish "${{ steps.package.outputs.path }}" --access public --tag latest

  verify-published-provenance:
    if: ${{ needs.tag-new-version.outputs.release_created == 'true' }}
    needs: [publish, slsa, tag-new-version]
    runs-on: ubuntu-latest
    permissions:
      attestations: read
      contents: read
    env:
      EXPECTED_SHA256: ${{ needs.slsa.outputs.package-download-sha256 }}
      PEPR_VERSION: ${{ needs.tag-new-version.outputs.release_version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Set up Node registry access
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.1
        with:
          node-version: 26
          registry-url: "https://registry.npmjs.org"

      - name: Install pinned npm
        run: |
          npm install --global npm@12.0.2
          npm --version

      - name: Download and verify published package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          package_directory="${RUNNER_TEMP}/published-package"
          package_path="${package_directory}/pepr-${PEPR_VERSION}.tgz"
          mkdir -p "$package_directory"

          for attempt in {1..5}; do
            if npm pack "pepr@${PEPR_VERSION}" --pack-destination "$package_directory" --silent; then
              break
            fi
            if (( attempt == 5 )); then
              echo "Unable to download pepr@${PEPR_VERSION} from npm." >&2
              exit 1
            fi
            echo "Published package is not available yet; retrying in 10 seconds."
            sleep 10
          done

          actual_sha256=$(sha256sum "$package_path" | awk '{print $1}')
          if [[ "$actual_sha256" != "$EXPECTED_SHA256" ]]; then
            echo "Published package SHA256 does not match the build output." >&2
            exit 1
          fi
          echo "path=$package_path" >> "$GITHUB_OUTPUT"

      - name: Verify GitHub artifact attestation
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_DIGEST: ${{ github.sha }}
        run: >-
          gh attestation verify "${{ steps.package.outputs.path }}"
          --repo defenseunicorns/pepr
          --predicate-type https://slsa.dev/provenance/v1
          --signer-workflow defenseunicorns/pepr/.github/workflows/release.yml
          --source-ref refs/heads/main
          --source-digest "$SOURCE_DIGEST"
          --deny-self-hosted-runners

      - name: Verify npm registry provenance
        shell: bash
        run: |
          set -euo pipefail
          verification_directory="${RUNNER_TEMP}/npm-provenance"
          mkdir -p "$verification_directory"
          cd "$verification_directory"
          npm init --yes > /dev/null
          npm install --ignore-scripts --no-audit --no-fund --save-exact "pepr@${PEPR_VERSION}"
          npm audit signatures

  pack-and-push:
    if: ${{ needs.tag-new-version.outputs.release_created == 'true' }}
    needs: [publish, slsa, tag-new-version]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      PEPR_VERSION: ${{ needs.tag-new-version.outputs.release_version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Download release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: ${{ runner.temp }}/release-package

      - name: Verify release package
        id: package
        shell: bash
        env:
          PACKAGE_DIRECTORY: ${{ runner.temp }}/release-package
          EXPECTED_SHA256: ${{ needs.slsa.outputs.package-download-sha256 }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=("$PACKAGE_DIRECTORY"/*.tgz)
          if (( ${#packages[@]} != 1 )); then
            echo "Expected exactly one release package, found ${#packages[@]}." >&2
            exit 1
          fi
          package_path="${packages[0]}"
          actual_sha256=$(sha256sum "$package_path" | awk '{print $1}')
          if [[ "$actual_sha256" != "$EXPECTED_SHA256" ]]; then
            echo "Release package SHA256 does not match the build output." >&2
            exit 1
          fi
          echo "name=$(basename "$package_path")" >> "$GITHUB_OUTPUT"

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.2.2

      - name: Docker login to UDS registry
        run: echo "${{ secrets.UDS_REGISTRY_PASSWORD }}" | docker login -u "${{ secrets.UDS_REGISTRY_USERNAME }}" --password-stdin registry.defenseunicorns.com

      - name: Push package to UDS OCI registry
        working-directory: ${{ runner.temp }}/release-package
        run: >-
          oras push registry.defenseunicorns.com/pepr-dev/npm/pepr:v${PEPR_VERSION}
          --artifact-type application/vnd.pepr.module.layer.v1
          "${{ steps.package.outputs.name }}"
