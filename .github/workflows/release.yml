name: Version Release # WARNING: docs.yml workflow_run trigger depends on this exact name

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "LICENSE"
      - "CODEOWNERS"

permissions:
  contents: read
  id-token: write # Required for OIDC

jobs:
  tag-new-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created || 'false' }}
      release_version: ${{ steps.release.outputs.version || 'UNRELEASED' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Create Release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-publish-images:
    needs: [publish, tag-new-version]
    if: ${{ needs.tag-new-version.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      packages: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Use Node.js 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Login to Chainguard
        uses: chainguard-dev/setup-chainctl@2cddd35a2f120d9973e58094dc6878c93cf58c28 # v0.5.1
        with:
          identity: ${{ secrets.CHAINGUARD_IDENTITY }}

      - name: UDS Registry Login
        run: echo "${{ secrets.UDS_REGISTRY_PASSWORD }}" | docker login -u "${{ secrets.UDS_REGISTRY_USERNAME }}" --password-stdin registry.defenseunicorns.com
        shell: bash

      - name: "Pepr Controller: Login to GHCR"
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: dummy
          password: ${{ github.token }}

      - name: Set Version
        env:
          RELEASE_VERSION: ${{ needs.tag-new-version.outputs.release_version }}
        run: |
          node ./scripts/set-version.js "$RELEASE_VERSION"
          npm ci

      - name: Publish to GHCR
        env:
          RELEASE_VERSION: ${{ needs.tag-new-version.outputs.release_version }}
        run: ./.github/workflows/scripts/release.sh "$RELEASE_VERSION"

  # SLSA builder does a shallow clone (fetch-depth: 1). The "set-version" npm
  # script handles this by running "git fetch --tags --force" before
  # "git describe --tags" to find the tag release-please just created.
  slsa: # This is where the slsa tarball is built for publish-package step
    if: ${{ needs.tag-new-version.outputs.release_created == 'true' }}
    permissions:
      id-token: write
      actions: read
      contents: read
    needs: [tag-new-version]
    uses: slsa-framework/slsa-github-generator/.github/workflows/builder_nodejs_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a #v2.1.0
    with:
      run-scripts: "set-version, ci, build"
    secrets: inherit

  publish:
    if: ${{ needs.tag-new-version.outputs.release_created == 'true' }}
    needs: [slsa, tag-new-version]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node registry authentication
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing requires npm 11.5.1 or newer. Pin the version used
      # for releases so it does not depend on the runner's bundled npm version.
      - name: Install npm with trusted publishing support
        run: |
          npm install --global npm@12.0.2
          npm --version

      - name: Download and verify SLSA package
        uses: slsa-framework/slsa-github-generator/.github/actions/secure-download-artifact@bb91a05077afa6601a3d7538c4cbbdbf0abe7ed9 # v2.0.0
        with:
          name: ${{ needs.slsa.outputs.package-download-name }}
          path: ${{ runner.temp }}/${{ needs.slsa.outputs.package-name }}
          sha256: ${{ needs.slsa.outputs.package-download-sha256 }}

      - name: Publish verified SLSA package with npm OIDC
        env:
          PACKAGE_PATH: ${{ runner.temp }}/${{ needs.slsa.outputs.package-name }}
        run: npm publish "$PACKAGE_PATH" --access public --tag latest

  pack-and-push:
    if: ${{ needs.tag-new-version.outputs.release_created == 'true' }}
    needs: [publish, tag-new-version]
    runs-on: ubuntu-latest
    env:
      PEPR_VERSION: ${{ needs.tag-new-version.outputs.release_version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Download ORAS
        run: |
          VERSION="1.2.2"
          curl -LO "https://github.com/oras-project/oras/releases/download/v${VERSION}/oras_${VERSION}_linux_amd64.tar.gz"
          mkdir -p oras-install/
          tar -zxf oras_${VERSION}_*.tar.gz -C oras-install/
          sudo mv oras-install/oras /usr/local/bin/
          rm -rf oras_${VERSION}_*.tar.gz oras-install/

      - name: Docker login to UDS registry
        run: echo "${{ secrets.UDS_REGISTRY_PASSWORD }}" | docker login -u "${{ secrets.UDS_REGISTRY_USERNAME }}" --password-stdin registry.defenseunicorns.com

      - name: Push package to UDS OCI registry
        run: |
          npm install --global npm
          node ./scripts/set-version.js "$PEPR_VERSION"
          npm ci
          npm run build
          oras push registry.defenseunicorns.com/pepr-dev/npm/pepr:v${PEPR_VERSION} \
            --artifact-type application/vnd.pepr.module.layer.v1 pepr-${PEPR_VERSION}.tgz
