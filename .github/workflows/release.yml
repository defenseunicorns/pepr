name: Version Release # WARNING: docs.yml workflow_run trigger depends on this exact name

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "LICENSE"
      - "CODEOWNERS"

permissions:
  contents: read
  id-token: write # Required for OIDC

jobs:
  tag-new-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created || 'false' }}
      release_version: ${{ steps.release.outputs.version || 'UNRELEASED' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Create Release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-publish-images:
    needs: [publish, tag-new-version]
    if: ${{ needs.tag-new-version.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      packages: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Use Node.js 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Login to Chainguard
        uses: chainguard-dev/setup-chainctl@2cddd35a2f120d9973e58094dc6878c93cf58c28 # v0.5.1
        with:
          identity: ${{ secrets.CHAINGUARD_IDENTITY }}

      - name: UDS Registry Login
        run: echo "${{ secrets.UDS_REGISTRY_PASSWORD }}" | docker login -u "${{ secrets.UDS_REGISTRY_USERNAME }}" --password-stdin registry.defenseunicorns.com
        shell: bash

      - name: "Pepr Controller: Login to GHCR"
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: dummy
          password: ${{ github.token }}

      - name: Set Version
        env:
          RELEASE_VERSION: ${{ needs.tag-new-version.outputs.release_version }}
        run: |
          node ./scripts/set-version.js "$RELEASE_VERSION"
          npm ci

      - name: Publish to GHCR
        env:
          RELEASE_VERSION: ${{ needs.tag-new-version.outputs.release_version }}
        run: ./.github/workflows/scripts/release.sh "$RELEASE_VERSION"

  slsa:
    if: ${{ needs.tag-new-version.outputs.release_created == 'true' }}
    needs: [tag-new-version]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    outputs:
      package-download-sha256: ${{ steps.package.outputs.sha256 }}
      provenance-url: ${{ steps.attest.outputs.attestation-url }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: "npm"

      - name: Build release package
        env:
          RELEASE_VERSION: ${{ needs.tag-new-version.outputs.release_version }}
        run: |
          node ./scripts/set-version.js "$RELEASE_VERSION"
          npm ci
          npm run build

      - name: Record release package digest
        id: package
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(pepr-*.tgz)
          if (( ${#packages[@]} != 1 )); then
            echo "Expected exactly one release package, found ${#packages[@]}." >&2
            exit 1
          fi
          package_path="${packages[0]}"
          echo "package-path=$package_path" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$package_path" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload release package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-package
          path: ${{ steps.package.outputs.package-path }}
          if-no-files-found: error

      - name: Attest release package
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.package-path }}

  publish:
    if: ${{ needs.tag-new-version.outputs.release_created == 'true' }}
    needs: [slsa, tag-new-version]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Set up Node registry authentication
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing requires npm 11.5.1 or newer. Pin the version used
      # for releases so it does not depend on the runner's bundled npm version.
      - name: Install npm with trusted publishing support
        run: |
          npm install --global npm@12.0.2
          npm --version

      - name: Download release package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-package
          path: ${{ runner.temp }}/release-package

      - name: Verify release package
        id: package
        shell: bash
        env:
          PACKAGE_DIRECTORY: ${{ runner.temp }}/release-package
          EXPECTED_SHA256: ${{ needs.slsa.outputs.package-download-sha256 }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=("$PACKAGE_DIRECTORY"/*.tgz)
          if (( ${#packages[@]} != 1 )); then
            echo "Expected exactly one release package, found ${#packages[@]}." >&2
            exit 1
          fi
          package_path="${packages[0]}"
          actual_sha256=$(sha256sum "$package_path" | awk '{print $1}')
          if [[ "$actual_sha256" != "$EXPECTED_SHA256" ]]; then
            echo "Release package SHA256 does not match the build output." >&2
            exit 1
          fi
          echo "path=$package_path" >> "$GITHUB_OUTPUT"

      - name: Publish verified package with npm OIDC
        run: npm publish "${{ steps.package.outputs.path }}" --access public --tag latest

  pack-and-push:
    if: ${{ needs.tag-new-version.outputs.release_created == 'true' }}
    needs: [publish, tag-new-version]
    runs-on: ubuntu-latest
    env:
      PEPR_VERSION: ${{ needs.tag-new-version.outputs.release_version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Download ORAS
        run: |
          VERSION="1.2.2"
          curl -LO "https://github.com/oras-project/oras/releases/download/v${VERSION}/oras_${VERSION}_linux_amd64.tar.gz"
          mkdir -p oras-install/
          tar -zxf oras_${VERSION}_*.tar.gz -C oras-install/
          sudo mv oras-install/oras /usr/local/bin/
          rm -rf oras_${VERSION}_*.tar.gz oras-install/

      - name: Docker login to UDS registry
        run: echo "${{ secrets.UDS_REGISTRY_PASSWORD }}" | docker login -u "${{ secrets.UDS_REGISTRY_USERNAME }}" --password-stdin registry.defenseunicorns.com

      - name: Push package to UDS OCI registry
        run: |
          npm install --global npm
          node ./scripts/set-version.js "$PEPR_VERSION"
          npm ci
          npm run build
          oras push registry.defenseunicorns.com/pepr-dev/npm/pepr:v${PEPR_VERSION} \
            --artifact-type application/vnd.pepr.module.layer.v1 pepr-${PEPR_VERSION}.tgz
