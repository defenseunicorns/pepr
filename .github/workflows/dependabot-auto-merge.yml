name: Dependabot auto-merge

on:
  pull_request:
    branches: [main]
    types:
      [
        opened,
        reopened,
        synchronize,
        edited,
        ready_for_review,
        converted_to_draft,
      ]

permissions:
  contents: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable-auto-merge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Keep commit verification enabled; do not check out or execute PR code.
      - name: Fetch verified Dependabot metadata
        id: metadata
        if: github.event.pull_request.commits == 1
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check every dependency against the auto-merge policy
        id: policy
        if: ${{ !cancelled() }}
        env:
          METADATA_OUTCOME: ${{ steps.metadata.outcome }}
          PR_COMMIT_COUNT: ${{ github.event.pull_request.commits }}
          PR_IS_DRAFT: ${{ github.event.pull_request.draft }}
          DEPENDENCIES_JSON: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";

          let dependencies = [];
          try {
            dependencies = JSON.parse(process.env.DEPENDENCIES_JSON || "[]");
          } catch {
            console.log("Invalid metadata; auto-merge is ineligible.");
          }
          const eligible = process.env.METADATA_OUTCOME === "success" &&
            process.env.PR_COMMIT_COUNT === "1" &&
            process.env.PR_IS_DRAFT === "false" &&
            Array.isArray(dependencies) && dependencies.length > 0 &&
            dependencies.every(dependency =>
              dependency.packageEcosystem === "npm_and_yarn" &&
              dependency.dependencyGroup === "development-dependencies" &&
              dependency.dependencyType === "direct:development" &&
              dependency.updateType === "version-update:semver-patch" &&
              dependency.directory === "/" &&
              dependency.targetBranch === "main" &&
              dependency.maintainerChanges === false
            );

          appendFileSync(process.env.GITHUB_OUTPUT, `eligible=${eligible}\n`);
          NODE

      # Auto-merge still waits for required CI checks and code-owner approval.
      # Security groups and all non-development/patch updates stay manual.
      - name: Apply auto-merge policy
        if: ${{ !cancelled() }}
        env:
          ELIGIBLE: ${{ steps.policy.outputs.eligible }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          state=$(gh pr view "$PR_URL" --json headRefOid,isDraft,autoMergeRequest \
            --jq '[.headRefOid, (.isDraft | tostring), (.autoMergeRequest != null | tostring)] | @tsv')
          read -r live_head is_draft auto_enabled <<< "$state"
          # A newer synchronize event owns the policy for a different head.
          if [[ "$live_head" != "$PR_HEAD_SHA" ]]; then
            exit 0
          fi
          if [[ "$ELIGIBLE" == "true" && "$is_draft" == "false" ]]; then
            gh pr merge --auto --squash --match-head-commit "$PR_HEAD_SHA" "$PR_URL"
          elif [[ "$auto_enabled" == "true" ]]; then
            gh pr merge --disable-auto "$PR_URL"
          fi
