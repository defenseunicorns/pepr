name: Dependabot auto-merge

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable-auto-merge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Execute the policy from the trusted base commit, never from the PR branch.
      - name: Check out the trusted auto-merge script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: .github/workflows/scripts/dependabot-auto-merge.ts
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # A single verified bot commit prevents manually added changes from qualifying.
      - name: Read verified Dependabot update details
        id: metadata
        if: github.event.pull_request.commits == 1
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge only for development patch updates
        # Still turn off a previous auto-merge setting if metadata verification fails.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METADATA_OUTCOME: ${{ steps.metadata.outcome }}
          DEPENDENCIES_JSON: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: node .github/workflows/scripts/dependabot-auto-merge.ts
