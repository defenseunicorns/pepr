name: Dependabot auto-merge

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable-auto-merge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # A single verified bot commit prevents manually added changes from qualifying.
      - name: Read verified Dependabot update details
        id: metadata
        if: github.event.pull_request.commits == 1
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge only for development patch updates
        # Still turn off a previous auto-merge setting if metadata verification fails.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METADATA_OUTCOME: ${{ steps.metadata.outcome }}
          DEPENDENCIES_JSON: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { execFileSync } from "node:child_process";

          const eventPr = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, "utf8")).pull_request;
          const currentPr = JSON.parse(execFileSync("gh", [
            "pr", "view", eventPr.html_url,
            "--json", "headRefOid,isDraft,autoMergeRequest"
          ], { encoding: "utf8" }));

          // 1. If new commits arrived, let their newer workflow run handle the PR.
          if (currentPr.headRefOid !== eventPr.head.sha) {
            process.exit(0);
          }

          // 2. Every package must be a development patch, such as 1.2.3 -> 1.2.4.
          // Missing or invalid metadata never qualifies for auto-merge.
          let dependencies = [];
          try {
            dependencies = JSON.parse(process.env.DEPENDENCIES_JSON || "[]");
          } catch {
            console.log("Invalid metadata; auto-merge will stay off.");
          }

          function isDevelopmentPatch(dependency) {
            return dependency !== null && typeof dependency === "object" &&
              dependency.packageEcosystem === "npm_and_yarn" &&
              dependency.dependencyGroup === "development-dependencies" &&
              dependency.dependencyType === "direct:development" &&
              dependency.updateType === "version-update:semver-patch" &&
              dependency.directory === "/" &&
              dependency.targetBranch === "main" &&
              dependency.maintainerChanges === false;
          }

          const allUpdatesAreDevelopmentPatches = Array.isArray(dependencies) &&
            dependencies.length > 0 && dependencies.every(isDevelopmentPatch);
          const canAutoMerge = process.env.METADATA_OUTCOME === "success" &&
            eventPr.commits === 1 && !eventPr.draft && !currentPr.isDraft &&
            allUpdatesAreDevelopmentPatches;

          // 3. Turn auto-merge on or off. Required CI and code-owner approval still apply.
          // This does not check out PR code or change when security PRs are created.
          if (canAutoMerge) {
            execFileSync("gh", [
              "pr", "merge", "--auto", "--squash",
              "--match-head-commit", eventPr.head.sha, eventPr.html_url
            ], { stdio: "inherit" });
          } else if (currentPr.autoMergeRequest) {
            execFileSync("gh", ["pr", "merge", "--disable-auto", eventPr.html_url], {
              stdio: "inherit"
            });
          }
          NODE
