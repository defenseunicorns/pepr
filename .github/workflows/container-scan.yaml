name: Container Scans

permissions:
  actions: read

on:
  merge_group:
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "CODEOWNERS"

jobs:
  container-scans:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write # Required by chainguard-dev/setup-chainctl step
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js latest
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: "npm"
      - name: Install Pepr Dependencies
        run: npm ci

      - name: Verify Chainguard image references match
        run: npm run check:container-image-equality

      - name: Login to Chainguard
        uses: chainguard-dev/setup-chainctl@2cddd35a2f120d9973e58094dc6878c93cf58c28 # v0.5.1
        with:
          identity: ${{ secrets.CHAINGUARD_IDENTITY }}

      - name: Build Pepr Controller Image
        run: npm run build:image

      - name: Vulnerability Scan
        id: scan
        continue-on-error: true # Scan again with JSON output for artifact upload
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: "pepr:dev"
          fail-build: true
          severity-cutoff: high
          output-format: table

      - name: Vulnerability Scan (JSON for Artifact)
        id: scan_json
        if: steps.scan.outcome == 'failure'
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: "pepr:dev"
          fail-build: false
          severity-cutoff: high
          output-format: json

      - name: Upload Scan Results
        if: steps.scan.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vulnerability-scan-results
          path: ${{ steps.scan_json.outputs.json }}
          retention-days: 30

      - name: Fail Build on Vulnerabilities
        if: steps.scan.outcome == 'failure'
        run: exit 1

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: pepr:dev
          upload-artifact: true
          upload-artifact-retention: 30
